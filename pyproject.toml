[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexswarm"
version = "1.0.0"
description = "LEXSWARM: AI Legal Defense System for the Unrepresented — 5B People, Zero Lawyers"
requires-python = ">=3.11"

dependencies = [
  "httpx>=0.27.0",
  "transformers>=4.40.0",
  "torch>=2.3.0",
  "langdetect>=1.0.9",
  "fastapi>=0.111.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.7.0",
  "python-telegram-bot>=21.3",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.1",
  "loguru>=0.7.2",
  "rich>=13.7.1",
  "sentence-transformers>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["intake","knowledge","regime","simulation","agent","alerts","api","scripts"]
