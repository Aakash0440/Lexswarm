# config/jurisdictions.yaml
# 10 countries × 10 case types = 100 statute sets
# Case types: housing, labor, criminal, family, immigration, consumer, civil, human_rights, debt, employment_discrimination

pakistan:
  code: PK
  legal_system: common_law_mixed
  official_languages: [ur, en]
  statutes:
    housing:
      - right: "Adequate written notice before eviction"
        statute: "Rent Restriction Ordinance 2001, Section 15"
        plain_english: "Landlord must give written notice before starting eviction. Verbal orders are illegal."
      - right: "Protection against illegal lockout"
        statute: "Transfer of Property Act 1882, Section 108"
        plain_english: "Changing locks without a court order is a criminal offence."
      - right: "Right to habitable premises"
        statute: "Building Control Ordinance 1979"
        plain_english: "Landlord must maintain property in safe, livable condition throughout tenancy."
      - right: "Security deposit return"
        statute: "Rent Restriction Ordinance 2001, Section 18"
        plain_english: "Security deposit must be returned within 30 days of vacating with itemized deductions."
    labor:
      - right: "Timely wage payment"
        statute: "Payment of Wages Act 1936, Section 4"
        plain_english: "Wages must be paid by the 7th of the following month. Failure is a criminal offence."
      - right: "Protection from wrongful termination"
        statute: "Industrial and Commercial Employment Ordinance 1968, Section 11"
        plain_english: "Employer must issue show-cause notice before dismissal."
      - right: "Annual leave entitlement"
        statute: "Factories Act 1934, Section 49-B"
        plain_english: "Workers get 14 days paid annual leave after 12 months of service."
      - right: "Overtime compensation"
        statute: "Factories Act 1934, Section 34"
        plain_english: "Overtime must be paid at double the ordinary rate of wages."
    criminal:
      - right: "Right to know charges"
        statute: "Code of Criminal Procedure 1898, Section 340"
        plain_english: "Police must inform you of charges in a language you understand without delay."
      - right: "Right to bail"
        statute: "Code of Criminal Procedure 1898, Sections 496-502"
        plain_english: "Bail is available for most non-capital offences."
      - right: "Right to legal counsel"
        statute: "Constitution of Pakistan 1973, Article 10-A"
        plain_english: "You have the right to a lawyer at all stages of criminal proceedings."
      - right: "Protection from torture"
        statute: "Pakistan Penal Code, Section 337"
        plain_english: "Any torture by police or state officials is a criminal offence."
    family:
      - right: "Maintenance rights"
        statute: "Muslim Family Laws Ordinance 1961, Section 9"
        plain_english: "Wife and children are entitled to maintenance from husband/father."
      - right: "Child custody principles"
        statute: "Guardians and Wards Act 1890, Section 17"
        plain_english: "Courts decide custody based on child welfare, not parents rights."
      - right: "Mehr entitlement"
        statute: "Muslim Family Laws Ordinance 1961, Section 10"
        plain_english: "Wife is entitled to full payment of mehr (dower) upon marriage dissolution."
      - right: "Divorce registration"
        statute: "Muslim Family Laws Ordinance 1961, Section 7"
        plain_english: "Talaq must be registered with Union Council. Divorce takes 90 days to finalize."
    immigration:
      - right: "Protection from arbitrary deportation"
        statute: "Foreigners Act 1946, Section 3"
        plain_english: "Foreigners cannot be deported without following due legal process."
      - right: "Right to appeal deportation order"
        statute: "Foreigners Act 1946, Section 9"
        plain_english: "You may appeal a deportation order before it is executed."
    consumer:
      - right: "Protection against fraud"
        statute: "Consumer Protection Act 2019"
        plain_english: "Businesses cannot use deceptive practices. File complaint with Consumer Court."
      - right: "Right to refund for defective goods"
        statute: "Consumer Protection Act 2019, Section 26"
        plain_english: "You are entitled to refund or replacement for defective products within 30 days."
    civil:
      - right: "Right to sue for breach of contract"
        statute: "Contract Act 1872, Section 73"
        plain_english: "You can claim compensation for all losses resulting from a broken contract."
      - right: "Limitation period for civil suits"
        statute: "Limitation Act 1908"
        plain_english: "Most civil suits must be filed within 3 years of the cause of action arising."
    human_rights:
      - right: "Right to life and liberty"
        statute: "Constitution of Pakistan 1973, Article 9"
        plain_english: "No person shall be deprived of life or liberty without due process of law."
      - right: "Freedom from arbitrary arrest"
        statute: "Constitution of Pakistan 1973, Article 10"
        plain_english: "You must be informed of grounds for arrest and produced before a magistrate within 24 hours."
    debt:
      - right: "Protection from harassment by debt collectors"
        statute: "Financial Institutions (Recovery of Finances) Ordinance 2001"
        plain_english: "Banks cannot harass or threaten you. They must follow legal recovery process."
      - right: "Right to debt restructuring"
        statute: "Banking Companies Ordinance 1962, Section 33-B"
        plain_english: "You may apply to the banking court for restructuring of outstanding loans."
    employment_discrimination:
      - right: "Equal pay for equal work"
        statute: "Constitution of Pakistan 1973, Article 25"
        plain_english: "Discrimination in pay on basis of sex or religion is unconstitutional."
      - right: "Protection from workplace harassment"
        statute: "Protection Against Harassment of Women at the Workplace Act 2010"
        plain_english: "Workplace harassment is a criminal offence. File complaint with Ombudsman."

united_states:
  code: US
  legal_system: common_law
  official_languages: [en]
  statutes:
    housing:
      - right: "Implied warranty of habitability"
        statute: "Common Law — all US states"
        source_url: "https://www.law.cornell.edu/wex/implied_warranty_of_habitability"
        plain_english: "Landlord must keep home livable — heat, no pests, safe structure."
      - right: "Anti-retaliation protection"
        statute: "NY Real Property Law § 223-b (varies by state)"
        plain_english: "Cannot be evicted for complaining to housing authorities."
      - right: "Security deposit limits"
        statute: "State security deposit laws (typically 1-2 months rent)"
        plain_english: "Landlord must return deposit within 14-30 days with itemized deductions."
      - right: "Fair Housing Act protection"
        statute: "Fair Housing Act 42 U.S.C. § 3604"
        plain_english: "Landlord cannot discriminate based on race, religion, sex, nationality, disability, or family status."
    labor:
      - right: "Federal minimum wage"
        statute: "Fair Labor Standards Act, 29 U.S.C. § 206"
        source_url: "https://www.law.cornell.edu/uscode/text/29/206"
        plain_english: "Federal minimum $7.25/hour. Many states higher. All hours must be paid."
      - right: "Overtime pay entitlement"
        statute: "Fair Labor Standards Act, 29 U.S.C. § 207"
        plain_english: "1.5x pay for all hours over 40 per week for non-exempt employees."
      - right: "Protection against retaliation"
        statute: "Fair Labor Standards Act, 29 U.S.C. § 215(a)(3)"
        plain_english: "Employer cannot fire you for complaining about wage violations."
      - right: "Safe workplace"
        statute: "Occupational Safety and Health Act 1970, 29 U.S.C. § 654"
        plain_english: "Employer must provide hazard-free workplace. File OSHA complaint anonymously."
    criminal:
      - right: "Miranda rights"
        statute: "Miranda v. Arizona (1966) / 5th Amendment"
        plain_english: "Police must read your rights before custodial interrogation."
      - right: "Right to attorney"
        statute: "6th Amendment / Gideon v. Wainwright (1963)"
        plain_english: "Free public defender if you cannot afford a lawyer in criminal cases."
      - right: "Protection against unreasonable search"
        statute: "4th Amendment, US Constitution"
        plain_english: "Police generally need a warrant to search your home or belongings."
      - right: "Right to speedy trial"
        statute: "6th Amendment / Speedy Trial Act 1974"
        plain_english: "You have the right to a trial without unreasonable delay."
    family:
      - right: "Child support enforcement"
        statute: "Child Support Enforcement Act, 42 U.S.C. § 651"
        plain_english: "Federal law requires states to enforce child support orders across state lines."
      - right: "Domestic violence protection orders"
        statute: "Violence Against Women Act (VAWA)"
        plain_english: "You can obtain a restraining order against an abusive partner."
      - right: "Parental rights in custody"
        statute: "Uniform Child Custody Jurisdiction Act (varies by state)"
        plain_english: "Both parents have equal rights to custody hearings. Best interests of child governs."
    immigration:
      - right: "Right to immigration hearing"
        statute: "Immigration and Nationality Act, 8 U.S.C. § 1229a"
        plain_english: "You have the right to a hearing before an immigration judge before removal."
      - right: "Asylum protection"
        statute: "Immigration and Nationality Act, 8 U.S.C. § 1158"
        plain_english: "You can apply for asylum if you fear persecution in your home country."
      - right: "Right to interpreter in proceedings"
        statute: "Court Interpreters Act, 28 U.S.C. § 1827"
        plain_english: "You have the right to a free interpreter in federal court proceedings."
    consumer:
      - right: "Protection from debt collector harassment"
        statute: "Fair Debt Collection Practices Act (FDCPA), 15 U.S.C. § 1692"
        plain_english: "Debt collectors cannot threaten, harass, or call at unreasonable hours."
      - right: "Credit report accuracy"
        statute: "Fair Credit Reporting Act (FCRA), 15 U.S.C. § 1681"
        plain_english: "You have the right to dispute inaccurate information on your credit report."
      - right: "Warranty protection"
        statute: "Magnuson-Moss Warranty Act, 15 U.S.C. § 2301"
        plain_english: "Written warranties on consumer products must be honored as stated."
    civil:
      - right: "Right to jury trial"
        statute: "7th Amendment, US Constitution"
        plain_english: "In civil cases over $20, you have the right to a jury trial in federal court."
      - right: "Statute of limitations"
        statute: "Varies by state and claim type (typically 2-6 years)"
        plain_english: "You must file civil claims within the limitation period or lose the right to sue."
    human_rights:
      - right: "Equal protection under law"
        statute: "14th Amendment, US Constitution"
        plain_english: "No state may deny any person equal protection of the laws."
      - right: "Civil rights protection"
        statute: "Civil Rights Act 1964, 42 U.S.C. § 2000e"
        plain_english: "Discrimination based on race, color, religion, sex, or national origin is illegal."
    debt:
      - right: "Bankruptcy protection"
        statute: "Bankruptcy Code, 11 U.S.C. § 101"
        plain_english: "You can file Chapter 7 or Chapter 13 bankruptcy to discharge or restructure debts."
      - right: "Wage garnishment limits"
        statute: "Consumer Credit Protection Act, 15 U.S.C. § 1673"
        plain_english: "Creditors can garnish no more than 25% of your disposable income."
    employment_discrimination:
      - right: "Protection from workplace discrimination"
        statute: "Title VII, Civil Rights Act 1964"
        plain_english: "Employer cannot discriminate based on race, color, religion, sex, or national origin."
      - right: "Age discrimination protection"
        statute: "Age Discrimination in Employment Act 1967 (ADEA)"
        plain_english: "Workers 40 and older cannot be discriminated against based on age."
      - right: "Disability accommodation"
        statute: "Americans with Disabilities Act 1990 (ADA)"
        plain_english: "Employer must provide reasonable accommodations for qualified disabled employees."

united_kingdom:
  code: GB
  legal_system: common_law
  official_languages: [en]
  statutes:
    housing:
      - right: "Section 21 notice requirement"
        statute: "Housing Act 1988, Section 21"
        source_url: "https://www.legislation.gov.uk/ukpga/1988/50/section/21"
        plain_english: "Landlord must give 2 months written notice for assured shorthold tenancies."
      - right: "Protection from illegal eviction"
        statute: "Protection from Eviction Act 1977"
        plain_english: "Illegal eviction or harassment by landlord is a criminal offence."
      - right: "Repair obligations"
        statute: "Landlord and Tenant Act 1985, Section 11"
        plain_english: "Landlord must repair structure, exterior, heating, and sanitation."
      - right: "Deposit protection"
        statute: "Housing Act 2004, Section 213"
        plain_english: "Landlord must protect deposit in government scheme within 30 days."
    labor:
      - right: "National minimum wage"
        statute: "National Minimum Wage Act 1998"
        plain_english: "£11.44/hour (2024) for workers 21+. Employer cannot pay less."
      - right: "Unfair dismissal protection"
        statute: "Employment Rights Act 1996, Section 94"
        plain_english: "After 2 years, cannot be dismissed without fair reason and fair process."
      - right: "Statutory sick pay"
        statute: "Social Security Contributions and Benefits Act 1992"
        plain_english: "£109.40/week SSP for up to 28 weeks if unable to work due to illness."
      - right: "Right to written employment particulars"
        statute: "Employment Rights Act 1996, Section 1"
        plain_english: "Employer must provide written statement of employment terms from day one."
    criminal:
      - right: "Right to legal advice at police station"
        statute: "Police and Criminal Evidence Act 1984, Section 58"
        plain_english: "You have the right to free legal advice at any police station at any time."
      - right: "Right to know reason for arrest"
        statute: "Police and Criminal Evidence Act 1984, Section 28"
        plain_english: "Police must tell you why you are being arrested at the time of arrest."
      - right: "Right to silence"
        statute: "Criminal Justice and Public Order Act 1994, Section 34"
        plain_english: "You have the right to remain silent. Adverse inferences may be drawn at trial."
      - right: "Bail rights"
        statute: "Bail Act 1976"
        plain_english: "You have a general right to bail. Police must justify refusal."
    family:
      - right: "Child maintenance enforcement"
        statute: "Child Support Act 1991"
        plain_english: "Child Maintenance Service can enforce payment from non-resident parent."
      - right: "Domestic violence injunction"
        statute: "Family Law Act 1996, Part IV"
        plain_english: "You can apply for a non-molestation order or occupation order against abuser."
      - right: "Financial provision on divorce"
        statute: "Matrimonial Causes Act 1973, Section 25"
        plain_english: "Court considers all assets, needs, and contributions when dividing finances on divorce."
    immigration:
      - right: "Right of appeal against refusal"
        statute: "Nationality, Immigration and Asylum Act 2002, Section 82"
        plain_english: "You have the right to appeal most immigration refusals to the First-tier Tribunal."
      - right: "Asylum claim right"
        statute: "Refugee Act / Asylum and Immigration Appeals Act 1993"
        plain_english: "You can claim asylum if you face persecution. Claim must be considered fairly."
    consumer:
      - right: "Right to refund within 30 days"
        statute: "Consumer Rights Act 2015, Section 20"
        plain_english: "You can get full refund if goods are faulty within 30 days of purchase."
      - right: "Protection from unfair contract terms"
        statute: "Consumer Rights Act 2015, Section 62"
        plain_english: "Unfair contract terms are not binding on consumers."
    civil:
      - right: "Small claims court access"
        statute: "Civil Procedure Rules, Part 27"
        plain_english: "Claims up to £10,000 can be heard in small claims court cheaply without a lawyer."
      - right: "Limitation periods"
        statute: "Limitation Act 1980"
        plain_english: "Most contract claims must be filed within 6 years. Personal injury within 3 years."
    human_rights:
      - right: "Right to fair trial"
        statute: "Human Rights Act 1998, Article 6"
        plain_english: "Everyone has the right to a fair and public hearing within a reasonable time."
      - right: "Right to private and family life"
        statute: "Human Rights Act 1998, Article 8"
        plain_english: "Public authorities cannot interfere with your private or family life without justification."
    debt:
      - right: "Protection from bailiff harassment"
        statute: "Taking Control of Goods Regulations 2013"
        plain_english: "Bailiffs must give 7 days written notice before visiting. Cannot enter by force."
      - right: "Right to debt relief order"
        statute: "Tribunals, Courts and Enforcement Act 2007"
        plain_english: "If you owe less than £30,000 and have low income, you may qualify for a debt relief order."
    employment_discrimination:
      - right: "Protection from discrimination"
        statute: "Equality Act 2010, Section 39"
        plain_english: "Employer cannot discriminate based on age, disability, gender, race, religion, or sexual orientation."
      - right: "Equal pay"
        statute: "Equality Act 2010, Section 65"
        plain_english: "Men and women doing equal work must receive equal pay."

india:
  code: IN
  legal_system: common_law
  official_languages: [hi, en]
  statutes:
    housing:
      - right: "Rent control protection"
        statute: "State Rent Control Acts (varies by state)"
        plain_english: "Landlords cannot arbitrarily increase rent or evict without proper notice."
      - right: "Security deposit limits"
        statute: "Model Tenancy Act 2021"
        plain_english: "Security deposit capped at 2 months rent for residential properties."
      - right: "Right to habitable premises"
        statute: "Transfer of Property Act 1882, Section 108"
        plain_english: "Landlord must keep premises fit for habitation throughout tenancy."
    labor:
      - right: "Gratuity after 5 years"
        statute: "Payment of Gratuity Act 1972, Section 4"
        plain_english: "After 5 years, entitled to 15 days salary per year of service."
      - right: "Provident fund contributions"
        statute: "Employees Provident Fund Act 1952"
        plain_english: "Employer must contribute 12% of your salary to PF account."
      - right: "Maternity benefit"
        statute: "Maternity Benefit Act 1961"
        plain_english: "26 weeks paid maternity leave for establishments with 10+ employees."
      - right: "Minimum wages"
        statute: "Minimum Wages Act 1948"
        plain_english: "State governments fix minimum wages. Employer must pay at least this amount."
    criminal:
      - right: "Right to free legal aid"
        statute: "Legal Services Authorities Act 1987"
        plain_english: "Free legal aid available to those earning below Rs 1 lakh annually."
      - right: "No arbitrary arrest"
        statute: "Constitution of India, Article 22"
        plain_english: "Police must inform you of grounds for arrest immediately."
      - right: "Right to bail"
        statute: "Code of Criminal Procedure 1973, Section 436"
        plain_english: "Bail is available as of right for bailable offences."
      - right: "Protection from custodial torture"
        statute: "Constitution of India, Article 21"
        plain_english: "Right to life includes right to be free from torture in custody."
    family:
      - right: "Maintenance rights"
        statute: "Section 125, Code of Criminal Procedure 1973"
        plain_english: "Wife, children, and parents can claim maintenance from husband/son."
      - right: "Protection from domestic violence"
        statute: "Protection of Women from Domestic Violence Act 2005"
        plain_english: "Women can obtain protection orders, residence orders, and compensation."
      - right: "Dowry prohibition"
        statute: "Dowry Prohibition Act 1961"
        plain_english: "Giving or taking dowry is a criminal offence punishable by imprisonment."
    immigration:
      - right: "Foreigners registration"
        statute: "Foreigners Act 1946 / Registration of Foreigners Rules 1992"
        plain_english: "Foreign nationals staying over 180 days must register with FRRO."
      - right: "Asylum consideration"
        statute: "Foreigners Act 1946 (India has no formal asylum law)"
        plain_english: "India considers asylum on case-by-case basis. UNHCR can assist with refugee status."
    consumer:
      - right: "Consumer dispute redressal"
        statute: "Consumer Protection Act 2019"
        plain_english: "File complaint with District Consumer Forum for disputes up to Rs 1 crore."
      - right: "E-commerce consumer protection"
        statute: "Consumer Protection (E-Commerce) Rules 2020"
        plain_english: "Online sellers must provide refunds and not engage in unfair trade practices."
    civil:
      - right: "Right to sue for breach of contract"
        statute: "Indian Contract Act 1872, Section 73"
        plain_english: "You can claim compensation for all losses resulting from a broken contract."
      - right: "Limitation periods"
        statute: "Limitation Act 1963"
        plain_english: "Most civil suits must be filed within 3 years of the cause arising."
    human_rights:
      - right: "Right to equality"
        statute: "Constitution of India, Article 14"
        plain_english: "The state shall not deny any person equality before the law."
      - right: "Right against exploitation"
        statute: "Constitution of India, Article 23"
        plain_english: "Traffic in human beings and forced labour is prohibited."
    debt:
      - right: "Protection from illegal recovery"
        statute: "Recovery of Debts Due to Banks Act 1993"
        plain_english: "Banks must follow legal process for debt recovery. No harassment or coercion allowed."
      - right: "Insolvency protection"
        statute: "Insolvency and Bankruptcy Code 2016"
        plain_english: "Individuals can apply for insolvency to restructure or discharge unmanageable debts."
    employment_discrimination:
      - right: "Equal opportunity in employment"
        statute: "Constitution of India, Article 16"
        plain_english: "No discrimination in public employment based on religion, race, caste, sex, or place of birth."
      - right: "Protection from sexual harassment"
        statute: "Sexual Harassment of Women at Workplace Act 2013 (POSH)"
        plain_english: "Every employer must have an Internal Complaints Committee for sexual harassment complaints."

