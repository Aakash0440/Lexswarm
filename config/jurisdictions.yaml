# config/jurisdictions.yaml
# Expanded offline statute database — 15 countries, 6 case types each
# Used when CourtListener/GovInfo APIs are unavailable
# Ensures LEXSWARM works fully offline / low bandwidth

pakistan:
  code: PK
  legal_system: common_law_mixed
  official_languages: [ur, en]
  statutes:
    housing:
      - right: "Adequate notice before eviction"
        statute: "Rent Restriction Ordinance 2001, Section 15"
        plain_english: "Landlord must give written notice. Verbal eviction is illegal."
      - right: "Protection against illegal lockout"
        statute: "Transfer of Property Act 1882, Section 108"
        plain_english: "Changing locks without court order is a criminal offence."
      - right: "Right to habitable premises"
        statute: "Building Control Ordinance 1979"
        plain_english: "Landlord must maintain the property in livable condition."
    labor:
      - right: "Timely wage payment"
        statute: "Payment of Wages Act 1936, Section 4"
        plain_english: "Wages must be paid by the 7th of the following month."
      - right: "Protection from wrongful termination"
        statute: "Industrial and Commercial Employment Ordinance 1968, Section 11"
        plain_english: "Employer must issue show-cause notice before dismissal."
      - right: "Annual leave entitlement"
        statute: "Factories Act 1934, Section 49-B"
        plain_english: "Workers get 14 days paid annual leave after 12 months service."
    criminal:
      - right: "Right to know charges"
        statute: "Code of Criminal Procedure 1898, Section 340"
        plain_english: "Police must inform you of charges in a language you understand."
      - right: "Right to bail"
        statute: "Code of Criminal Procedure 1898, Sections 496-502"
        plain_english: "Bail is available for most non-capital offences."
      - right: "Right to legal counsel"
        statute: "Constitution of Pakistan 1973, Article 10-A"
        plain_english: "You have the right to a lawyer at all stages of proceedings."
    family:
      - right: "Maintenance rights"
        statute: "Muslim Family Laws Ordinance 1961, Section 9"
        plain_english: "Wife and children are entitled to maintenance from husband/father."
      - right: "Child custody principles"
        statute: "Guardians and Wards Act 1890, Section 17"
        plain_english: "Courts decide custody based on child's welfare, not parents' rights."
    immigration:
      - right: "Protection from arbitrary deportation"
        statute: "Foreigners Act 1946, Section 3"
        plain_english: "Foreigners cannot be deported without following due legal process."
    consumer:
      - right: "Protection against fraud"
        statute: "Consumer Protection Act 2019"
        plain_english: "Businesses cannot use deceptive practices. You can file a complaint."

india:
  code: IN
  legal_system: common_law
  official_languages: [hi, en]
  statutes:
    labor:
      - right: "Gratuity after 5 years service"
        statute: "Payment of Gratuity Act 1972, Section 4"
        plain_english: "After 5 years, you get 15 days salary per year of service."
      - right: "Provident fund contributions"
        statute: "Employees Provident Fund Act 1952"
        plain_english: "Employer must contribute 12% of your salary to PF account."
      - right: "Maternity benefit"
        statute: "Maternity Benefit Act 1961"
        plain_english: "26 weeks paid maternity leave for establishments with 10+ employees."
    housing:
      - right: "Rent control protection"
        statute: "State Rent Control Acts (varies by state)"
        plain_english: "Landlords cannot arbitrarily increase rent or evict without notice."
      - right: "Security deposit limits"
        statute: "Model Tenancy Act 2021"
        plain_english: "Security deposit capped at 2 months rent for residential properties."
    criminal:
      - right: "Right to free legal aid"
        statute: "Legal Services Authorities Act 1987"
        plain_english: "Free legal aid available to anyone earning below Rs 1 lakh annually."
      - right: "No arbitrary arrest"
        statute: "Constitution of India, Article 22"
        plain_english: "Police must inform you of grounds for arrest immediately."

united_states:
  code: US
  legal_system: common_law
  official_languages: [en]
  statutes:
    housing:
      - right: "Implied warranty of habitability"
        statute: "Common law (all US states)"
        source_url: "https://www.law.cornell.edu/wex/implied_warranty_of_habitability"
        plain_english: "Landlord must keep home livable — heat, no pests, safe structure."
      - right: "Anti-retaliation protection"
        statute: "Various state statutes (e.g. NY Real Property Law 223-b)"
        plain_english: "Cannot be evicted for complaining to housing authorities."
      - right: "Security deposit return"
        statute: "State security deposit laws (14-30 days return requirement)"
        plain_english: "Landlord must return deposit within 14-30 days (varies by state) with itemized deductions."
    labor:
      - right: "Federal minimum wage"
        statute: "Fair Labor Standards Act 29 U.S.C. § 206"
        source_url: "https://www.law.cornell.edu/uscode/text/29/206"
        plain_english: "Minimum $7.25/hour federal (states may be higher)."
      - right: "Overtime pay"
        statute: "Fair Labor Standards Act 29 U.S.C. § 207"
        plain_english: "1.5x pay for hours over 40 per week for non-exempt employees."
      - right: "Safe workplace"
        statute: "Occupational Safety and Health Act 1970, 29 U.S.C. § 654"
        plain_english: "Employer must provide hazard-free workplace. File OSHA complaint anonymously."
    criminal:
      - right: "Miranda rights"
        statute: "Miranda v. Arizona (1966) / 5th Amendment"
        plain_english: "Police must read your rights before custodial interrogation."
      - right: "Right to attorney"
        statute: "6th Amendment, US Constitution / Gideon v. Wainwright (1963)"
        plain_english: "Free public defender if you cannot afford a lawyer in criminal cases."
      - right: "Presumption of innocence"
        statute: "Due Process — 5th and 14th Amendments"
        plain_english: "Prosecution must prove guilt beyond reasonable doubt."
    immigration:
      - right: "Right to hearing before deportation"
        statute: "Immigration and Nationality Act, 8 U.S.C. § 1229a"
        plain_english: "You have the right to an immigration hearing before a judge before being removed."
      - right: "Asylum protection"
        statute: "Immigration and Nationality Act, 8 U.S.C. § 1158"
        plain_english: "You can apply for asylum if you fear persecution in your home country."

united_kingdom:
  code: GB
  legal_system: common_law
  official_languages: [en]
  statutes:
    housing:
      - right: "Section 21 notice requirement"
        statute: "Housing Act 1988, Section 21"
        source_url: "https://www.legislation.gov.uk/ukpga/1988/50/section/21"
        plain_english: "Landlord must give 2 months written notice for assured shorthold tenancies."
      - right: "Protection from harassment"
        statute: "Protection from Eviction Act 1977"
        plain_english: "Landlord cannot harass you to leave. Illegal eviction is a criminal offence."
      - right: "Repair obligations"
        statute: "Landlord and Tenant Act 1985, Section 11"
        plain_english: "Landlord must repair structure, exterior, heating, and sanitation."
    labor:
      - right: "National minimum wage"
        statute: "National Minimum Wage Act 1998"
        plain_english: "£11.44/hour (2024) for workers 21+. Employer cannot pay less."
      - right: "Unfair dismissal protection"
        statute: "Employment Rights Act 1996, Section 94"
        plain_english: "After 2 years, you cannot be dismissed without fair reason and process."
      - right: "Statutory sick pay"
        statute: "Social Security Contributions and Benefits Act 1992"
        plain_english: "£109.40/week SSP for up to 28 weeks if unable to work due to illness."

indonesia:
  code: ID
  legal_system: civil_law_mixed
  official_languages: [id]
  statutes:
    labor:
      - right: "Protection against illegal termination"
        statute: "Manpower Act No. 13/2003, Article 151"
        plain_english: "Employers must negotiate and get court approval before termination."
      - right: "Severance pay entitlement"
        statute: "Manpower Act No. 13/2003, Article 156"
        plain_english: "Terminated workers get severance of 1-9 months salary based on tenure."
      - right: "Minimum wage protection"
        statute: "Government Regulation No. 78/2015"
        plain_english: "Employer must pay at least the regional minimum wage (UMR)."
    housing:
      - right: "Tenant eviction process"
        statute: "Civil Code (KUHPerdata) Article 1576"
        plain_english: "Landlord must follow legal process for eviction — cannot forcibly remove you."
    criminal:
      - right: "Right to legal counsel"
        statute: "Criminal Procedure Code (KUHAP) Article 54"
        plain_english: "You have the right to a lawyer from the moment of arrest."

nigeria:
  code: NG
  legal_system: common_law_mixed
  official_languages: [en]
  statutes:
    labor:
      - right: "Termination notice"
        statute: "Labour Act Cap L1 LFN 2004, Section 11"
        plain_english: "Employer must give notice before termination — 1 day to 1 month depending on service length."
      - right: "Wage payment"
        statute: "Labour Act, Section 7"
        plain_english: "Wages must be paid in legal tender at agreed intervals."
    criminal:
      - right: "Right to remain silent"
        statute: "Constitution of Nigeria 1999, Section 35(6)"
        plain_english: "You cannot be compelled to give evidence that may incriminate you."
      - right: "Right to fair hearing"
        statute: "Constitution of Nigeria 1999, Section 36"
        plain_english: "Everyone has the right to a fair hearing within a reasonable time."

south_africa:
  code: ZA
  legal_system: mixed_civil_common
  official_languages: [en, af, zu, xh]
  statutes:
    housing:
      - right: "Right to adequate housing"
        statute: "Constitution of South Africa 1996, Section 26"
        plain_english: "Everyone has the right of access to adequate housing."
      - right: "Protection against arbitrary eviction"
        statute: "Prevention of Illegal Eviction Act 19 of 1998"
        plain_english: "Court order required before eviction. Court considers all circumstances."
    labor:
      - right: "Protection against unfair dismissal"
        statute: "Labour Relations Act 66 of 1995, Section 185"
        plain_english: "Dismissal must be for valid reason following fair procedure."

kenya:
  code: KE
  legal_system: common_law
  official_languages: [en, sw]
  statutes:
    labor:
      - right: "Employment terms"
        statute: "Employment Act 2007, Section 9"
        plain_english: "Employer must provide written employment terms within 2 months of starting."
    criminal:
      - right: "Right to bail"
        statute: "Constitution of Kenya 2010, Article 49"
        plain_english: "Every arrested person has the right to be released on bond or bail."

bangladesh:
  code: BD
  legal_system: common_law
  official_languages: [bn]
  statutes:
    labor:
      - right: "Maternity leave"
        statute: "Bangladesh Labour Act 2006, Section 46"
        plain_english: "16 weeks paid maternity leave for female workers."
      - right: "Weekly rest day"
        statute: "Bangladesh Labour Act 2006, Section 103"
        plain_english: "Workers entitled to 1 rest day per week."
