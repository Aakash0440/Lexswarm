    debt:
      - right: "Debt restructuring (WSNP)"
        statute: "Wet schuldsanering natuurlijke personen (WSNP)"
        plain_english: "If you cannot pay your debts, you can apply for a statutory debt restructuring arrangement through court."
      - right: "Protection from illegal debt collection"
        statute: "Wet incassokosten / Burgerlijk Wetboek"
        plain_english: "Debt collectors must follow strict rules. Harassment, threats, or excessive fees are illegal."
    employment_discrimination:
      - right: "Equal treatment in employment"
        statute: "Wet gelijke behandeling op grond van handicap of chronische ziekte / AWGB"
        plain_english: "Employer cannot discriminate based on disability, religion, race, gender, age, or sexual orientation."
      - right: "Equal pay obligation"
        statute: "Wet gelijke behandeling van mannen en vrouwen, Article 7"
        plain_english: "Men and women must receive equal pay for equal work. Unequal pay can be challenged in court."

  germany:
  code: DE
  legal_system: civil_law
  official_languages: [de]
  statutes:
    housing:
      - right: "Protection from illegal eviction"
        statute: "Bürgerliches Gesetzbuch (BGB), § 535-580a"
        plain_english: "Landlord cannot evict without a court order. Self-help eviction (changing locks, removing belongings) is a criminal offence."
      - right: "Notice period before eviction"
        statute: "BGB § 573c"
        plain_english: "Landlord must give 3-9 months written notice depending on tenancy length. Notice must state valid legal reason."
      - right: "Rent cap protection"
        statute: "Mietpreisbremse (BGB § 556d)"
        plain_english: "In designated areas, rent cannot exceed local reference rent by more than 10%. File complaint with local authority."
      - right: "Security deposit limits"
        statute: "BGB § 551"
        plain_english: "Deposit cannot exceed 3 months' cold rent. Must be held in separate account and returned within 6 months."
      - right: "Right to habitable premises"
        statute: "BGB § 536"
        plain_english: "Tenant can reduce rent proportionally if property has defects affecting habitability."
    labor:
      - right: "Minimum wage"
        statute: "Mindestlohngesetz (MiLoG) § 1"
        plain_english: "€12.41/hour minimum wage (2024). Applies to all workers in Germany regardless of nationality or contract type."
      - right: "Protection from unfair dismissal"
        statute: "Kündigungsschutzgesetz (KSchG) § 1"
        plain_english: "After 6 months, dismissal must have valid reason — personal, conduct-based, or operational. File with labour court within 3 weeks."
      - right: "Annual leave entitlement"
        statute: "Bundesurlaubsgesetz (BUrlG) § 3"
        plain_english: "Minimum 24 working days paid annual leave (based on 6-day week). Most contracts give 25-30 days."
      - right: "Wage payment obligation"
        statute: "BGB § 614"
        plain_english: "Wages must be paid at agreed intervals. Employer who withholds wages is in breach and liable for interest."
      - right: "Works council rights"
        statute: "Betriebsverfassungsgesetz (BetrVG)"
        plain_english: "Employees in companies with 5+ workers can elect a works council with co-determination rights."
    criminal:
      - right: "Right to legal counsel"
        statute: "Strafprozessordnung (StPO) § 137"
        plain_english: "Every accused person has the right to consult a lawyer at any stage. Free legal aid (Pflichtverteidiger) in serious cases."
      - right: "Right to remain silent"
        statute: "StPO § 136"
        plain_english: "Police must inform you of your right to remain silent before questioning. Nothing you say can be forced."
      - right: "Maximum pre-charge detention"
        statute: "Grundgesetz Art. 104 / StPO § 128"
        plain_english: "Police can hold you maximum 48 hours without bringing you before a judge."
      - right: "Right to interpreter"
        statute: "StPO § 187"
        plain_english: "Free interpreter for all criminal proceedings if you do not speak German."
    family:
      - right: "Child maintenance"
        statute: "BGB § 1601-1615 / Düsseldorfer Tabelle"
        plain_english: "Both parents must support children. Amount based on Düsseldorf Table by income. Enforceable through Jugendamt."
      - right: "Domestic violence protection order"
        statute: "Gewaltschutzgesetz (GewSchG) § 1"
        plain_english: "Court can issue protection order within hours. Police can remove abuser from home immediately."
      - right: "Divorce and asset division"
        statute: "BGB § 1564-1587"
        plain_english: "Divorce requires 1-year separation period. Assets and pension rights accumulated during marriage are split equally."
    immigration:
      - right: "Residence permit rights"
        statute: "Aufenthaltsgesetz (AufenthG) § 4"
        plain_english: "Foreign nationals need valid residence permit. Various permit types for work, family, study, humanitarian reasons."
      - right: "Asylum application right"
        statute: "Asylgesetz (AsylG) § 13"
        plain_english: "Anyone in Germany can apply for asylum. Apply at BAMF (Bundesamt für Migration und Flüchtlinge)."
      - right: "Non-refoulement protection"
        statute: "AufenthG § 60"
        plain_english: "Cannot be deported to country where you face death, torture, or persecution."
      - right: "Trafficking victim protection"
        statute: "AufenthG § 25 Abs. 4a"
        plain_english: "Trafficking victims can receive temporary residence permit regardless of immigration status."
    consumer:
      - right: "Consumer withdrawal right"
        statute: "BGB § 355"
        plain_english: "14 days to withdraw from distance contracts (online, phone) without giving reasons."
      - right: "Warranty rights"
        statute: "BGB § 437"
        plain_english: "2-year warranty on all goods. Seller must repair, replace, or refund defective items."
      - right: "Protection from unfair terms"
        statute: "BGB § 305-310"
        plain_english: "Unfair standard contract terms are void. Consumer cannot be bound by surprising or disadvantageous clauses."
    civil:
      - right: "Small claims access"
        statute: "ZPO § 495a"
        plain_english: "Claims up to €5,000 can be handled by simplified procedure in Amtsgericht (local court)."
      - right: "Limitation periods"
        statute: "BGB § 195"
        plain_english: "Standard limitation period is 3 years from end of year in which claim arose."
    human_rights:
      - right: "Right to dignity"
        statute: "Grundgesetz (GG) Art. 1"
        plain_english: "Human dignity is inviolable. All state authority must respect and protect it."
      - right: "Right to equality"
        statute: "Grundgesetz Art. 3 / Allgemeines Gleichbehandlungsgesetz (AGG)"
        plain_english: "No one may be disadvantaged due to sex, parentage, race, language, homeland, origin, beliefs, or disability."
    debt:
      - right: "Personal insolvency protection"
        statute: "Insolvenzordnung (InsO) § 304-314"
        plain_english: "Individuals can file for personal insolvency. After 3 years of good conduct, remaining debts are discharged."
      - right: "Wage garnishment limits"
        statute: "ZPO § 850c"
        plain_english: "Basic income is protected from garnishment. Only income above subsistence level can be seized by creditors."
    employment_discrimination:
      - right: "Protection from workplace discrimination"
        statute: "Allgemeines Gleichbehandlungsgesetz (AGG) § 7"
        plain_english: "Discrimination based on race, gender, religion, disability, age, or sexual orientation in employment is prohibited."
      - right: "Equal pay"
        statute: "Entgelttransparenzgesetz 2017"
        plain_english: "Workers in companies with 200+ employees can request information about pay of colleagues doing equal work."

france:
  code: FR
  legal_system: civil_law
  official_languages: [fr]
  statutes:
    housing:
      - right: "Protection from illegal eviction"
        statute: "Loi du 6 juillet 1989, Article 24"
        plain_english: "Landlord cannot evict without a court order. Winter truce (trêve hivernale) from Nov 1 to Mar 31 — no evictions allowed."
      - right: "Notice period"
        statute: "Loi du 6 juillet 1989, Article 15"
        plain_english: "Landlord must give 3 months notice for unfurnished, 1 month for furnished accommodation. Must be sent by registered mail."
      - right: "Deposit limits and return"
        statute: "Loi du 6 juillet 1989, Article 22"
        plain_english: "Deposit capped at 1 month's rent (unfurnished) or 2 months (furnished). Must be returned within 1-2 months."
      - right: "Habitable premises obligation"
        statute: "Loi du 6 juillet 1989, Article 6"
        plain_english: "Landlord must deliver and maintain property in decent condition throughout tenancy."
    labor:
      - right: "SMIC minimum wage"
        statute: "Code du travail, Article L3231-2"
        plain_english: "€11.65/hour gross minimum wage (2024). All workers regardless of contract type are entitled to SMIC."
      - right: "Protection from unfair dismissal"
        statute: "Code du travail, Article L1232-1"
        plain_english: "Dismissal must have real and serious cause. Written notice required. Dismissed worker entitled to severance after 8 months."
      - right: "35-hour working week"
        statute: "Code du travail, Article L3121-27"
        plain_english: "Legal working week is 35 hours. Hours beyond this must be paid as overtime at 25-50% premium."
      - right: "Paid annual leave"
        statute: "Code du travail, Article L3141-3"
        plain_english: "Workers earn 2.5 days paid leave per month worked — 30 days (5 weeks) per year minimum."
      - right: "Undeclared work protection"
        statute: "Code du travail, Article L8221-5 / L8223-1"
        plain_english: "Undeclared workers (travail au noir) are entitled to all labor rights. Can claim 6 months salary as compensation."
    criminal:
      - right: "Right to legal counsel"
        statute: "Code de procédure pénale, Article 63-3-1"
        plain_english: "Right to consult a lawyer from the first hour of police custody. Free legal aid if you cannot afford one."
      - right: "Maximum custody duration"
        statute: "Code de procédure pénale, Article 63"
        plain_english: "Police custody (garde à vue) limited to 24 hours, extendable to 48 hours by prosecutor."
      - right: "Right to interpreter"
        statute: "Code de procédure pénale, Article 63-1"
        plain_english: "Free interpreter if you do not understand French. Must be informed of rights in a language you understand."
      - right: "Presumption of innocence"
        statute: "Déclaration des droits de l'homme, Article 9"
        plain_english: "Every accused person is presumed innocent until proven guilty by a competent court."
    family:
      - right: "Child maintenance"
        statute: "Code civil, Article 371-2"
        plain_english: "Both parents must contribute to child maintenance proportionate to their resources. Enforceable through CAF."
      - right: "Domestic violence protection"
        statute: "Loi du 9 juillet 2010 / Code civil, Article 515-9"
        plain_english: "Judge can issue emergency protection order (ordonnance de protection) within 6 days. Abuser can be removed from home."
      - right: "Divorce rights"
        statute: "Code civil, Article 229-237"
        plain_english: "Four grounds for divorce: mutual consent, acceptance, fault, definitive breakdown. Compensatory allowance available."
    immigration:
      - right: "Asylum right"
        statute: "CESEDA (Code de l'entrée et du séjour des étrangers), Article L521-1"
        plain_english: "Anyone in France can apply for asylum at OFPRA. Application must be filed within 90 days of arrival."
      - right: "Non-refoulement"
        statute: "CESEDA Article L513-2"
        plain_english: "Cannot be expelled to country where life or freedom is threatened or where you risk torture."
      - right: "Regularization for long-term residents"
        statute: "CESEDA Article L435-1"
        plain_english: "Undocumented person with strong ties to France (work, family, integration) can apply for regularization."
      - right: "Trafficking victim protection"
        statute: "CESEDA Article L316-1"
        plain_english: "Trafficking victims who cooperate with authorities can obtain temporary residence permit."
    consumer:
      - right: "14-day withdrawal right"
        statute: "Code de la consommation, Article L221-18"
        plain_english: "14 days to withdraw from any distance or off-premises contract without justification."
      - right: "Legal guarantee of conformity"
        statute: "Code de la consommation, Article L217-4"
        plain_english: "Seller must deliver goods conforming to contract. 2-year guarantee — repair, replace, or refund defective goods."
    civil:
      - right: "Small claims — juridiction de proximité"
        statute: "Code de procédure civile"
        plain_english: "Claims up to €10,000 handled by tribunal judiciaire (simplified procedure). No lawyer required under €10,000."
      - right: "Limitation periods"
        statute: "Code civil, Article 2224"
        plain_english: "General limitation period is 5 years from when claimant knew or should have known of their right."
    human_rights:
      - right: "Right to equality"
        statute: "Loi du 27 mai 2008 / Code pénal Article 225-1"
        plain_english: "Discrimination based on origin, sex, religion, disability, age, sexual orientation is prohibited in employment and services."
      - right: "Right to dignity"
        statute: "Déclaration des droits de l'homme 1789 / Constitution 1958"
        plain_english: "Human dignity is a constitutional principle. Degrading treatment by any person or authority is prohibited."
    debt:
      - right: "Over-indebtedness procedure"
        statute: "Code de la consommation, Article L711-1"
        plain_english: "Individuals unable to pay debts can apply to Commission de surendettement for debt restructuring or erasure."
      - right: "Protection from abusive debt collection"
        statute: "Code de la consommation, Article L125-1"
        plain_english: "Debt collectors cannot harass, threaten, or contact you at unreasonable hours. Report to DGCCRF."
    employment_discrimination:
      - right: "Non-discrimination in employment"
        statute: "Code du travail, Article L1132-1"
        plain_english: "Employer cannot discriminate based on origin, sex, morals, sexual orientation, age, disability, religion, or political opinion."
      - right: "Equal pay"
        statute: "Code du travail, Article L3221-2"
        plain_english: "Equal pay for equal work is mandatory. Pay gap reports required for companies with 50+ employees."

saudi_arabia:
  code: SA
  legal_system: islamic_law_mixed
  official_languages: [ar]
  statutes:
    housing:
      - right: "Tenant rights under tenancy contract"
        statute: "Royal Decree M/50 — Real Estate Rental Law"
        plain_english: "Tenancy contracts must be registered in Ejar system. Landlord cannot evict before contract expires without legal cause."
      - right: "Protection from arbitrary rent increase"
        statute: "Real Estate General Authority regulations"
        plain_english: "Rent increases must comply with REGA guidelines. Dispute rent increases through REGA platform."
    labor:
      - right: "Wage protection"
        statute: "Saudi Labor Law, Article 90 / Wage Protection System"
        plain_english: "Wages must be paid monthly via Wage Protection System (WPS). Employer who fails to pay faces work permit suspension."
      - right: "Annual leave entitlement"
        statute: "Saudi Labor Law, Article 109"
        plain_english: "Workers get 21 days paid annual leave after 1 year, increasing to 30 days after 5 years."
      - right: "End of service gratuity"
        statute: "Saudi Labor Law, Article 84"
        plain_english: "Worker is entitled to gratuity of half month salary per year for first 5 years, then full month per year thereafter."
      - right: "Protection from arbitrary dismissal"
        statute: "Saudi Labor Law, Article 80"
        plain_english: "Dismissal without valid reason entitles worker to compensation of at least 2 months salary per year of service."
      - right: "Domestic worker protection"
        statute: "Domestic Workers Regulation 2013 (Royal Decree M/78)"
        plain_english: "Domestic workers entitled to 9 hours rest daily, one day off per week, paid leave, and medical care from employer."
    criminal:
      - right: "Right to legal representation"
        statute: "Code of Criminal Procedure, Article 102"
        plain_english: "Every accused person has the right to appoint a lawyer. Court must appoint one if accused cannot afford it."
      - right: "Maximum pre-trial detention"
        statute: "Code of Criminal Procedure, Article 103"
        plain_english: "Detention without charge is limited. Detainee must be brought before Public Prosecution within 5 days."
      - right: "Right to be informed of charges"
        statute: "Code of Criminal Procedure, Article 101"
        plain_english: "Accused must be informed of charges against them before interrogation begins."
    family:
      - right: "Nafaqa (maintenance) rights"
        statute: "Personal Status Law / Islamic Sharia principles"
        plain_english: "Husband is obligated to provide financial support (nafaqa) to wife and children. Enforceable through family court."
      - right: "Khul divorce right"
        statute: "Personal Status Law, Article 106"
        plain_english: "Wife can obtain divorce (khul) by returning dowry (mahr) to husband. Does not require husband's consent."
      - right: "Child custody principles"
        statute: "Personal Status Law / Sharia principles"
        plain_english: "Mother has custody of young children (boys to age 9, girls to puberty) unless deemed unfit by court."
    immigration:
      - right: "Kafala system — right to transfer sponsorship"
        statute: "Labor Reform Initiative 2021"
        plain_english: "Workers can transfer to new employer without current sponsor's permission after 1 year of service. File through MHRSD portal."
      - right: "Exit visa reform"
        statute: "Labor Reform Initiative 2021"
        plain_english: "Workers in private sector can exit Saudi Arabia without employer permission after notifying through Absher portal."
      - right: "Protection from passport confiscation"
        statute: "Saudi Labor Law, Article 40"
        plain_english: "Employer is prohibited from confiscating worker's passport. This is a criminal offence. Report to MHRSD."
      - right: "Runaway worker shelter"
        statute: "MHRSD regulations"
        plain_english: "Domestic workers facing abuse can call 19911 (MHRSD hotline) to be placed in shelter and have case investigated."
    consumer:
      - right: "Consumer protection"
        statute: "Consumer Protection Law (Royal Decree M/33)"
        plain_english: "Right to safe products, accurate information, and fair contracts. File complaint with Ministry of Commerce."
      - right: "E-commerce protection"
        statute: "E-Commerce Law 2019"
        plain_english: "Online sellers must provide clear information, honor contracts, and process refunds for defective goods."
    civil:
      - right: "Contract enforcement"
        statute: "Civil Transactions Law 2021"
        plain_english: "Contracts are binding under Saudi law. Breach entitles affected party to compensation through commercial courts."
      - right: "Limitation periods"
        statute: "Civil Transactions Law 2021"
        plain_english: "General limitation period is 10 years for civil claims. Shorter periods apply to commercial and labor claims."
    human_rights:
      - right: "Protection from torture"
        statute: "Basic Law of Governance, Article 40 / Anti-Torture regulations"
        plain_english: "Torture and degrading treatment are prohibited. Confessions obtained under duress are inadmissible."
      - right: "Right to fair trial"
        statute: "Basic Law of Governance, Article 38"
        plain_english: "No crime and no punishment without a legal provision. Trials must follow prescribed legal procedures."
    debt:
      - right: "Bankruptcy protection"
        statute: "Bankruptcy Law (Royal Decree M/50) 2018"
        plain_english: "Individuals and businesses can file for bankruptcy protection and debt restructuring through commercial courts."
      - right: "Protection from illegal debt collection"
        statute: "Saudi Labor Law / Civil Transactions Law"
        plain_english: "Debt collectors cannot use threats, harassment, or coercion. Illegal collection methods are criminal offences."
    employment_discrimination:
      - right: "Saudization quota compliance"
        statute: "Nitaqat Program / Saudi Labor Law Article 26"
        plain_english: "Employers must meet Saudi national employment quotas. Foreign workers should not be used to displace Saudi workers unfairly."
      - right: "Equal pay provisions"
        statute: "Saudi Labor Law, Article 3"
        plain_english: "Workers performing same work must receive equal wages without discrimination based on sex or nationality."

united_arab_emirates:
  code: AE
  legal_system: civil_law_mixed_islamic
  official_languages: [ar]
  statutes:
    housing:
      - right: "Tenant eviction protection"
        statute: "Dubai Law No. 33 of 2008 / Abu Dhabi Law No. 20 of 2006"
        plain_english: "Landlord must give 12 months notice through notary public before eviction for personal use or sale. Shorter notice for non-payment."
      - right: "Rent dispute resolution"
        statute: "Dubai Rental Disputes Centre / RERA regulations"
        plain_english: "Rent disputes must be filed with Rental Disputes Centre (RDC). RERA Rent Calculator determines allowable increases."
      - right: "Security deposit protection"
        statute: "RERA regulations"
        plain_english: "Deposit must be returned within 30 days of vacating. Unjustified deductions can be disputed at RDC."
    labor:
      - right: "Wage protection"
        statute: "Federal Decree-Law No. 33 of 2021 (Labour Law), Article 18 / WPS"
        plain_english: "Wages must be paid through Wage Protection System (WPS). Employer who fails faces work permit ban and fines."
      - right: "Annual leave"
        statute: "Labour Law 2021, Article 29"
        plain_english: "Workers get 30 days paid annual leave after 1 year of service. Pro-rated for shorter service."
      - right: "End of service gratuity"
        statute: "Labour Law 2021, Article 51"
        plain_english: "Workers get 21 days salary per year for first 5 years, then 30 days per year thereafter. Payable on all terminations."
      - right: "Protection from passport confiscation"
        statute: "Labour Law 2021, Article 13(7)"
        plain_english: "Employer is strictly prohibited from confiscating worker's passport. Criminal offence punishable by fine and imprisonment."
      - right: "Domestic worker protection"
        statute: "Federal Law No. 10 of 2017 on Domestic Workers"
        plain_english: "Domestic workers entitled to 12 hours rest daily, 1 day off weekly, 30 days annual leave, and medical insurance."
    criminal:
      - right: "Right to legal representation"
        statute: "UAE Criminal Procedure Law, Article 96"
        plain_english: "Every accused has right to legal counsel. Court assigns lawyer if accused cannot afford one in serious cases."
      - right: "Right to consular notification"
        statute: "Vienna Convention on Consular Relations, Article 36"
        plain_english: "Foreign nationals have right to be informed of consular access and to contact their embassy upon arrest."
      - right: "Right to interpreter"
        statute: "UAE Criminal Procedure Law"
        plain_english: "Free interpreter provided if accused does not understand Arabic during all legal proceedings."
    family:
      - right: "Maintenance rights"
        statute: "UAE Personal Status Law (Federal Law No. 28 of 2005), Article 63"
        plain_english: "Husband must provide maintenance for wife and children. Enforceable through family court."
      - right: "Child custody"
        statute: "Personal Status Law, Article 143-156"
        plain_english: "Mother has custody of young children. Father is guardian (wali). Court decides based on best interests of child."
      - right: "Domestic violence protection"
        statute: "Federal Law No. 10 of 2019 on Protection from Domestic Violence"
        plain_english: "Court can issue protection order against abuser within 48 hours. Violation is a criminal offence."
    immigration:
      - right: "Residency visa rights"
        statute: "Federal Decree-Law No. 29 of 2021 on Entry and Residence"
        plain_english: "Workers must have valid residence visa sponsored by employer. Visa cancellation does not remove labor rights."
      - right: "Job mobility without NOC"
        statute: "Labour Law 2021, Article 40"
        plain_english: "Workers can change jobs without No Objection Certificate after completing probation or with 1 month notice."
      - right: "Trafficking victim protection"
        statute: "Federal Law No. 51 of 2006 on Combating Human Trafficking"
        plain_english: "Trafficking victims are protected and supported. Call National Committee to Combat Human Trafficking: 800-HUMANRIGHTS."
    consumer:
      - right: "Consumer protection"
        statute: "Federal Law No. 15 of 2020 on Consumer Protection"
        plain_english: "Right to safe products, accurate information, and fair contracts. File complaint with Ministry of Economy."
      - right: "Refund rights"
        statute: "Consumer Protection Law 2020, Article 14"
        plain_english: "Consumer can return defective goods for refund or replacement. Seller cannot impose unreasonable no-return policies."
    civil:
      - right: "Contract enforcement"
        statute: "UAE Civil Transactions Law (Federal Law No. 5 of 1985)"
        plain_english: "Contracts are binding. Breach entitles affected party to compensation. Disputes resolved in civil courts."
      - right: "Limitation periods"
        statute: "Civil Transactions Law, Article 473"
        plain_english: "General limitation period is 15 years. Labor claims must be filed within 1 year of termination."
    human_rights:
      - right: "Protection from torture"
        statute: "UAE Constitution, Article 26"
        plain_english: "No person shall be subjected to physical or moral harm. Torture is prohibited and punishable."
      - right: "Right to fair trial"
        statute: "UAE Constitution, Article 28"
        plain_english: "Punishment is personal. No crime without law. Everyone has right to fair judicial hearing."
    debt:
      - right: "Bankruptcy protection"
        statute: "Federal Decree-Law No. 9 of 2016 on Bankruptcy"
        plain_english: "Individuals and companies can file for bankruptcy protection and debt restructuring through competent courts."
      - right: "Bounced cheque decriminalization"
        statute: "Federal Decree-Law No. 14 of 2020"
        plain_english: "Bounced cheques are now civil matters (not criminal) for amounts under AED 200,000. Dispute through civil court."
    employment_discrimination:
      - right: "Non-discrimination in employment"
        statute: "Labour Law 2021, Article 4"
        plain_english: "No discrimination based on race, color, sex, religion, national origin, or disability in employment."
      - right: "Equal pay"
        statute: "Labour Law 2021, Article 4"
        plain_english: "Female workers must receive equal pay for equal work. Gender-based pay discrimination is prohibited."

philippines:
  code: PH
  legal_system: mixed_civil_common
  official_languages: [fil, en]
  statutes:
    housing:
      - right: "Rent control protection"
        statute: "Rent Control Act 2009 (Republic Act 9653)"
        plain_english: "Rent increases capped at 7% per year for units under PHP 10,000/month in Metro Manila and other areas."
      - right: "Protection from illegal eviction"
        statute: "RA 9653, Section 9"
        plain_english: "Landlord cannot eject tenant without valid cause and court order. Verbal notice or threats are not legal eviction."
      - right: "Security deposit limits"
        statute: "RA 9653, Section 7"
        plain_english: "Advance rent and deposit combined cannot exceed 2 months. Must be returned within 1 month of vacating."
    labor:
      - right: "Minimum wage"
        statute: "Labor Code of the Philippines, Article 99 / RTWPB orders"
        plain_english: "Minimum wage varies by region. Metro Manila: PHP 610/day (2024). Set by Regional Tripartite Wages and Productivity Boards."
      - right: "Security of tenure"
        statute: "Labor Code, Article 294 (formerly 279)"
        plain_english: "Regular employees cannot be dismissed without just or authorized cause and due process. Illegal dismissal entitles backwages."
      - right: "13th month pay"
        statute: "Presidential Decree 851"
        plain_english: "All rank-and-file employees entitled to 13th month pay equivalent to 1/12 of annual salary. Paid by December 24."
      - right: "Overseas worker protection (POEA)"
        statute: "Migrant Workers Act RA 8042 as amended by RA 10022"
        plain_english: "OFWs are protected by POEA-approved contracts. Recruiters cannot charge placement fees to workers."
      - right: "Illegal recruitment prohibition"
        statute: "RA 8042, Section 6"
        plain_english: "Illegal recruitment (charging fees, false promises) is a criminal offence. Report to POEA or DOLE."
    criminal:
      - right: "Miranda rights"
        statute: "1987 Constitution, Article III, Section 12"
        plain_english: "Right to be informed of rights, right to counsel, right to remain silent. Waiver must be in writing with counsel present."
      - right: "Right to bail"
        statute: "1987 Constitution, Article III, Section 13"
        plain_english: "Right to bail except for offences punishable by reclusion perpetua when evidence of guilt is strong."
      - right: "Right to speedy trial"
        statute: "1987 Constitution, Article III, Section 14 / Speedy Trial Act RA 8493"
        plain_english: "Trial must begin within 30 days of arraignment. Unreasonable delays entitle accused to dismissal."
      - right: "Free legal assistance"
        statute: "Public Attorney's Office Act RA 9406"
        plain_english: "Public Attorney's Office (PAO) provides free legal services to indigent persons in criminal and civil cases."
    family:
      - right: "Legal separation (no divorce)"
        statute: "Family Code, Article 55-67"
        plain_english: "Philippines has no divorce. Legal separation allows separate living and asset division but not remarriage."
      - right: "Annulment grounds"
        statute: "Family Code, Article 45"
        plain_english: "Marriage can be annulled on specific grounds including psychological incapacity, fraud, or lack of parental consent."
      - right: "Child support"
        statute: "Family Code, Article 194-208"
        plain_english: "Both parents must support children proportionate to their resources. File for support in Family Court."
      - right: "Protection from VAWC"
        statute: "Anti-Violence Against Women and Children Act RA 9262"
        plain_english: "Women and children protected from physical, psychological, sexual, and economic abuse. Court can issue protection order."
    immigration:
      - right: "OFW protection abroad"
        statute: "RA 8042 / RA 10022 (Migrant Workers Act)"
        plain_english: "Philippine embassies must assist distressed OFWs. Government provides legal assistance and repatriation for OFWs in crisis."
      - right: "Anti-trafficking protection"
        statute: "Anti-Trafficking in Persons Act RA 9208 as amended by RA 10364"
        plain_english: "Trafficking is a serious crime. Victims entitled to protection, rehabilitation, and legal assistance. Call IACAT hotline."
      - right: "Illegal recruiter liability"
        statute: "RA 10022, Section 7"
        plain_english: "Illegal recruitment causing economic sabotage is punishable by life imprisonment. Victims entitled to damages."
    consumer:
      - right: "Consumer protection"
        statute: "Consumer Act RA 7394"
        plain_english: "Right to safe products, accurate information, and fair contracts. File complaint with DTI."
      - right: "Product liability"
        statute: "Consumer Act RA 7394, Article 97"
        plain_english: "Manufacturers and sellers liable for damage caused by defective products."
    civil:
      - right: "Small claims access"
        statute: "Revised Rules of Small Claims Cases (A.M. No. 08-8-7-SC)"
        plain_english: "Claims up to PHP 400,000 can be filed in small claims court. No lawyers required. Resolved in one day."
      - right: "Limitation periods"
        statute: "Civil Code, Article 1144-1155"
        plain_english: "Written contract claims: 10 years. Oral contract: 6 years. Injury: 4 years. Fraud: 4 years."
    human_rights:
      - right: "Right to equality"
        statute: "1987 Constitution, Article III, Section 1"
        plain_english: "No person shall be deprived of life, liberty, or property without due process of law or equal protection."
      - right: "Anti-discrimination"
        statute: "SOGIE Equality Bill / various local anti-discrimination ordinances"
        plain_english: "Discrimination based on sexual orientation, gender identity, and expression prohibited in many LGUs."
    debt:
      - right: "Personal insolvency"
        statute: "Financial Rehabilitation and Insolvency Act RA 10142"
        plain_english: "Individuals can file for suspension of payments or liquidation of assets to deal with unmanageable debts."
      - right: "Protection from loan shark harassment"
        statute: "Lending Company Regulation Act RA 9474"
        plain_english: "Lending companies must be registered. Harassment, threats, or public shaming by lenders is illegal."
    employment_discrimination:
      - right: "Non-discrimination in employment"
        statute: "Labor Code, Article 135 / RA 7277 (Magna Carta for Disabled Persons)"
        plain_english: "Discrimination in employment based on sex, disability, or other protected characteristics is prohibited."
      - right: "Equal pay for women"
        statute: "RA 6725 / Labor Code Article 135"
        plain_english: "It is unlawful to discriminate against women with respect to terms and conditions of employment including compensation."

turkey:
  code: TR
  legal_system: civil_law
  official_languages: [tr]
  statutes:
    housing:
      - right: "Tenant protection from eviction"
        statute: "Türk Borçlar Kanunu (TBK), Madde 347-356"
        plain_english: "Landlord cannot evict without court order or valid legal cause. Tenant in fixed-term contract cannot be evicted before expiry."
      - right: "Rent increase limits"
        statute: "TBK Madde 344 / Kira Artış Sınırı"
        plain_english: "Rent increases capped at inflation rate (CPI). Increases above CPI are legally unenforceable."
      - right: "Security deposit return"
        statute: "TBK Madde 342"
        plain_english: "Deposit cannot exceed 3 months rent. Must be held in interest-bearing account and returned within 3 months of vacating."
    labor:
      - right: "Minimum wage"
        statute: "4857 Sayılı İş Kanunu / Asgari Ücret"
        plain_english: "National minimum wage set by Minimum Wage Determination Commission twice yearly. Applies to all workers."
      - right: "Job security protection"
        statute: "İş Kanunu Madde 18-21"
        plain_english: "Workers in companies with 30+ employees cannot be dismissed without valid reason after 6 months. Reinstatement or compensation available."
      - right: "Annual leave"
        statute: "İş Kanunu Madde 53"
        plain_english: "Minimum 14 days paid leave (1-5 years service), 20 days (5-15 years), 26 days (15+ years)."
      - right: "Severance pay"
        statute: "1475 Sayılı İş Kanunu Madde 14"
        plain_english: "Workers dismissed after 1 year entitled to severance of 30 days gross salary per year of service."
      - right: "Wage payment protection"
        statute: "İş Kanunu Madde 32"
        plain_english: "Wages must be paid in Turkish lira at least monthly. Employer who fails to pay for 20 days faces sanctions."
    criminal:
      - right: "Right to legal counsel"
        statute: "Ceza Muhakemesi Kanunu (CMK), Madde 147"
        plain_english: "Every suspect has right to consult lawyer from first interrogation. Free legal aid if cannot afford one."
      - right: "Maximum pre-charge detention"
        statute: "CMK Madde 91"
        plain_english: "Police can detain for maximum 24 hours (extendable to 4 days for organized crime). Must be brought before judge for remand."
      - right: "Right to remain silent"
        statute: "CMK Madde 147 / Anayasa Madde 38"
        plain_english: "No one can be compelled to make a statement against themselves. Right to silence must be explained before questioning."
      - right: "Right to interpreter"
        statute: "CMK Madde 202"
        plain_english: "Free interpreter in all criminal proceedings if accused does not understand Turkish."
    family:
      - right: "Child maintenance"
        statute: "Türk Medeni Kanunu (TMK), Madde 182"
        plain_english: "Court sets child maintenance at divorce. Both parents obliged to contribute. Amount can be revised as circumstances change."
      - right: "Domestic violence protection"
        statute: "6284 Sayılı Ailenin Korunması Kanunu"
        plain_english: "Court can issue immediate protection order. Police can remove abuser from home same day. Violation is criminal offence."
      - right: "Divorce and asset division"
        statute: "TMK Madde 161-184 / Edinilmiş mallara katılma"
        plain_english: "Assets acquired during marriage (excluding gifts/inheritance) are equally divided. Compensation available for contributing spouse."
    immigration:
      - right: "Residence permit rights"
        statute: "6458 Sayılı Yabancılar ve Uluslararası Koruma Kanunu (YUKK)"
        plain_english: "Foreign nationals can apply for short-term, family, student, or long-term residence permits through Provincial Directorates."
      - right: "International protection (asylum)"
        statute: "YUKK Madde 61-95"
        plain_english: "Syrians and others can apply for temporary or international protection. Apply to PDMM (Provincial Directorate of Migration Management)."
      - right: "Non-refoulement"
        statute: "YUKK Madde 4"
        plain_english: "No one shall be returned to a place where they face risk of torture, persecution, or degrading treatment."
    consumer:
      - right: "Consumer protection"
        statute: "6502 Sayılı Tüketicinin Korunması Hakkında Kanun"
        plain_english: "Right to safe products, fair contracts, and accurate information. File complaint with Consumer Arbitration Committee (Tüketici Hakem Heyeti)."
      - right: "14-day withdrawal right"
        statute: "TKHK Madde 48-49"
        plain_english: "14 days to withdraw from distance contracts without reason or penalty."
    civil:
      - right: "Small claims — Sulh Hukuk Mahkemesi"
        statute: "Hukuk Muhakemeleri Kanunu (HMK)"
        plain_english: "Claims up to TRY 1,000,000 handled by Sulh Hukuk Mahkemesi. Simplified and faster procedure."
      - right: "Limitation periods"
        statute: "Türk Borçlar Kanunu Madde 146"
        plain_english: "General limitation period is 10 years. Labor claims: 5 years. Tort claims: 2 years from knowledge of damage."
    human_rights:
      - right: "Right to equality"
        statute: "Türkiye Cumhuriyeti Anayasası, Madde 10"
        plain_english: "All individuals are equal before the law regardless of language, race, color, sex, political opinion, or religion."
      - right: "Prohibition of torture"
        statute: "Anayasa Madde 17 / TCK Madde 94-95"
        plain_english: "No one shall be subjected to torture or ill-treatment. Torture by public officials is punishable by 3-12 years imprisonment."
    debt:
      - right: "Enforcement and bankruptcy protection"
        statute: "2004 Sayılı İcra ve İflas Kanunu"
        plain_english: "Debtors can apply for concordat (debt restructuring) to prevent bankruptcy. Creditors must follow legal enforcement procedures."
      - right: "Wage protection in bankruptcy"
        statute: "İİK Madde 206"
        plain_english: "Employee wage claims are preferential debts in bankruptcy — paid before unsecured creditors."
    employment_discrimination:
      - right: "Equal treatment in employment"
        statute: "İş Kanunu Madde 5 / 6701 Sayılı Türkiye İnsan Hakları ve Eşitlik Kurumu Kanunu"
        plain_english: "Employer cannot discriminate based on language, race, sex, disability, political opinion, or religion in employment."
      - right: "Equal pay"
        statute: "İş Kanunu Madde 5"
        plain_english: "Equal pay for equal work is mandatory. Gender-based pay discrimination is prohibited."